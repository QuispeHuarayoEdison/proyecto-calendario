<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101411">
  <title>ORBITA — tiempo con intención</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegación principal">
      <a class="brand" href="#hoy" aria-label="Orbita, inicio">
        <span class="brand-mark"><i></i><i></i><i></i></span>
        <span>orbita<span class="brand-period">.</span></span>
      </a>
      <div class="workspace-label">ESPACIO PERSONAL</div>
      <nav class="primary-nav">
        <button class="nav-item active" data-view="hoy"><span class="nav-icon">◷</span><span>Mi día</span><span class="nav-shortcut">01</span></button>
        <button class="nav-item" data-view="calendario"><span class="nav-icon">▦</span><span>Calendario</span><span class="nav-shortcut">02</span></button>
        <button class="nav-item" data-view="bitacora"><span class="nav-icon">≡</span><span>Bitácora</span><span class="nav-shortcut">03</span></button>
      </nav>
      <div class="sidebar-rule"></div>
      <div class="sidebar-caption">TU RITMO</div>
      <div class="focus-card">
        <div class="focus-card-top"><span class="live-dot"></span><span>SEMANA ACTUAL</span><span class="focus-arrow">↗</span></div>
        <div class="focus-number" id="sidebar-hours">—<small> h</small></div>
        <div class="focus-caption">horas estimadas completadas</div>
        <div class="mini-bars" aria-label="Actividad de la semana"><i style="height:35%"></i><i style="height:60%"></i><i style="height:43%"></i><i style="height:82%"></i><i style="height:58%"></i><i style="height:26%"></i><i style="height:12%"></i></div>
        <div class="mini-days"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
      </div>
      <div class="sidebar-bottom">
        <div class="privacy-note"><span class="lock-icon">▣</span><span>Tu bitácora es privada.<br><b>Solo tú puedes leerla.</b></span></div>
        <button class="account-switch" id="account-switch" aria-expanded="false">
          <span class="avatar" id="account-avatar">S</span><span class="account-meta"><b id="account-name">Sofía Martín</b><small id="account-role">Mi espacio</small></span><span class="switch-chevron">⌄</span>
        </button>
        <div class="account-menu" id="account-menu" hidden></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><span>ESPACIO</span><span class="crumb-slash">/</span><b id="top-context">MI DÍA</b></div>
        <div class="topbar-right"><span class="today-stamp" id="today-stamp"></span><button class="icon-button" id="help-button" aria-label="Información de privacidad" title="Información de privacidad">i</button></div>
      </header>
      <div id="app-view" class="view-content"></div>
      <footer class="app-footer"><span>ORBITA <span class="footer-mark">●</span> TIEMPO CON INTENCIÓN</span><span>HECHO PARA TU PROPIO RITMO</span></footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
